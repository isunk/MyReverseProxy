# mrp 反向代理路由配置
#
# servers:
#   - domain: api.target-app.com # （必填）域名
#     protocol: https # （可选）协议，http 或 https，默认匹配任意
#     port: 443 # （可选）端口，1-65535，默认匹配任意
#     routes:
#       - prefix: /v1/ # （必填）路径前缀，以 / 开头，最长匹配
#         upstream: https://api.our-server.com/v1/ # （可选）上游地址或本地目录，与 status 互斥
#         host: api.our-server.com # （可选）改写转发 Host 头；部分上游会校验 Host，此时需将该字段设为目标 Host（如上游域名）
#         headers:
#           request: # （可选）改写发往上游的请求头
#             Authorization: "Bearer token"
#           response: # （可选）覆盖下游返回的响应头
#             Access-Control-Allow-Origin: "*"
#             Access-Control-Allow-Methods: "GET, POST, OPTIONS"
#       - prefix: /health
#         status: 200 # （可选）短路状态码，200-599，与 upstream 互斥
#         body: OK # （可选）status 的响应体
#       - prefix: /assets/
#         upstream: ./dist
#       - prefix: /
#         upstream: 192.168.1.50:8080
#   - domain: "*.target-app.com" # 前缀通配符，匹配指定 3 级域名下的所有 4 级子域名
#     routes:
#       - prefix: /
#         upstream: http://127.0.0.1:9000
#   - domain: "*" # 通配符，匹配任意域名；无 routes 时 CONNECT 强制走 MITM 而非隧道，配合 --capture 将解密后的 HTTP 记录为 HAR
# nameservers: # （可选）DNS 列表，裸 IP 或 host:port，按序故障切换，默认按系统 DNS 解析
#   - "114.114.114.114"
#   - "223.5.5.5"
#   - "[2001:4860:4860::8888]:5353"

servers: []
nameservers:
  - "114.114.114.114"
  - "8.8.8.8"
